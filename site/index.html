<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Towers of Saeroth</title>
<meta name="description" content="Worldbuilding vault and Pathfinder 2e reference for Towers of Saeroth.">
<meta name="theme-color" content="#1b1a18">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Saeroth">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <button id="menuBtn" class="iconbtn" aria-label="Toggle navigation" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <a class="brand" href="#/campaign/README.md">Towers of Saeroth</a>
  <div class="spacer"></div>
  <button id="searchBtn" class="iconbtn" aria-label="Search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.2-4.2"/></svg>
  </button>
  <button id="themeBtn" class="iconbtn" aria-label="Toggle theme">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</header>

<div class="layout">
  <nav id="sidebar" class="sidebar" aria-label="Note tree">
    <div class="sidehead">
      <input id="filter" type="search" placeholder="Filter notes…" autocomplete="off" spellcheck="false">
    </div>
    <div id="tree" class="tree"></div>
  </nav>
  <div id="scrim" class="scrim" hidden></div>
  <main id="main" class="main">
    <article id="content" class="content"><p class="muted">Loading…</p></article>
    <section id="backlinks" class="backlinks" hidden></section>
  </main>
</div>

<div id="searchModal" class="modal" hidden>
  <div class="modalbox" role="dialog" aria-modal="true" aria-label="Search notes">
    <input id="searchInput" type="search" placeholder="Search all notes…" autocomplete="off" spellcheck="false">
    <div id="searchResults" class="results"></div>
    <p class="hint muted">Campaign notes search full text. The rules vault searches by title.</p>
  </div>
</div>

<script src="marked.min.js"></script>
<script src="app.js"></script>
</body>
</html>
