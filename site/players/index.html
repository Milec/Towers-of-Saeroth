<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saeroth — for players</title>
<meta name="description" content="What a traveller in Saeroth could reasonably know.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1b1a18">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<meta name="apple-mobile-web-app-title" content="Saeroth">
<link rel="stylesheet" href="../styles.css">
<style>
  /* This page is deliberately its own small thing: no tree, no search, no
     graph, no service worker, and no link to the vault in either direction.
     It borrows the parchment palette from styles.css and nothing else. */
  /* styles.css pins html and body to 100dvh because the vault app scrolls an
     inner element. This page scrolls the document instead, so a body that
     tall is a box the content overflows — and a sticky child can only stick
     inside its own containing block, which is why the topbar scrolled away
     the moment anything below it was made sticky. Let the body grow. */
  html, body { height: auto; min-height: 100%; }

  /* ---- palette -------------------------------------------------------
     Taken off the sigil: near-black ground, antique gold line-work, blood
     crimson. Declared three times over the way styles.css does it — bare
     :root for light, [data-theme] for an explicit choice, and the media
     query for the default "system" setting, which stamps no attribute. */
  :root {
    --p-gold: #9c7a41; --p-gold-soft: #c2a878; --p-gold-wash: #f0e6cf;
    --p-crimson: #8e1524; --p-crimson-ink: #7a1120;
  }
  :root[data-theme="dark"] {
    --bg: #131211; --panel: #1c1a17; --rule: #38312a;
    --p-gold: #c29a58; --p-gold-soft: #8b7142; --p-gold-wash: #241f18;
    --p-crimson: #c2334a; --p-crimson-ink: #d9576b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #131211; --panel: #1c1a17; --rule: #38312a;
      --p-gold: #c29a58; --p-gold-soft: #8b7142; --p-gold-wash: #241f18;
      --p-crimson: #c2334a; --p-crimson-ink: #d9576b;
    }
  }

  .brand { display: inline-flex; align-items: center; gap: 9px; }
  .pmark { width: 26px; height: 26px; flex: 0 0 auto;
           filter: drop-shadow(0 1px 2px rgba(0,0,0,.35)); }

  .pmain { max-width: 74ch; margin: 0 auto; padding: 18px clamp(14px, 4vw, 40px) 90px; }

  /* ---- navigation ----------------------------------------------------
     Seven tabs wrapped onto three rows of chips and pushed the page down
     with furniture. One row that scrolls sideways holds any number of them,
     stays put while you read, and keeps the current one visible because
     show() scrolls it into view. */
  .ptabnav {
    position: sticky; top: var(--topbar-h, 55px); z-index: 20;
    padding: 9px clamp(14px, 4vw, 40px) 10px;
    background: var(--bg); border-bottom: 1px solid var(--rule);
  }
  /* A row that scrolls sideways and does not say so is a row with tabs
     nobody finds. An arrow appears on whichever side has more, over a fade
     that leaves the next tab half-visible, and pressing it scrolls. */
  .pscroll {
    position: absolute; top: 0; bottom: 0; width: 52px; z-index: 2;
    display: none; align-items: center; padding: 0 10px;
    border: 0; background: none; cursor: pointer;
  }
  .ptabnav.can-left .pscroll-l, .ptabnav.can-right .pscroll-r { display: flex; }
  .pscroll::before {                       /* the fade, under the chip */
    content: ''; position: absolute; inset: 0; z-index: 0;
  }
  .pscroll-l { left: 0; justify-content: flex-start; }
  .pscroll-r { right: 0; justify-content: flex-end; }
  .pscroll-l::before { background: linear-gradient(90deg, var(--bg) 42%, transparent); }
  .pscroll-r::before { background: linear-gradient(270deg, var(--bg) 42%, transparent); }
  .pscroll span {                          /* and the chip, so it reads pressable */
    position: relative; z-index: 1;
    display: grid; place-items: center; width: 29px; height: 29px;
    border-radius: 50%; background: var(--panel);
    border: 1px solid var(--p-gold); color: var(--p-crimson);
    font: 700 19px/1 ui-sans-serif, system-ui, sans-serif;
    padding-bottom: 2px; box-shadow: 0 1px 5px rgba(0,0,0,.3);
  }
  .pscroll:hover span { background: var(--p-crimson); border-color: var(--p-crimson); color: #fff; }
  .pscroll:focus-visible span { outline: 2px solid var(--p-gold); outline-offset: 2px; }
  .ptabnav::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -3px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--p-gold), transparent);
    opacity: .5;
  }
  .ptabs {
    max-width: min(1120px, 100%); margin: 0 auto;
    display: flex; flex-wrap: nowrap; gap: 6px; overflow-x: auto;
    scrollbar-width: none; -ms-overflow-style: none;
    scroll-snap-type: x proximity; scroll-padding-inline: 34px;
    -webkit-overflow-scrolling: touch;
  }
  .ptabs::-webkit-scrollbar { display: none; }
  .ptab {
    flex: 0 0 auto; scroll-snap-align: start; white-space: nowrap;
    padding: 7px 14px; border: 1px solid var(--rule); border-radius: 999px;
    background: var(--panel); color: var(--ink); font: inherit; font-size: 14.5px;
    cursor: pointer; transition: border-color .12s, color .12s;
  }
  .ptab:hover { border-color: var(--p-gold); color: var(--p-crimson-ink); }
  .ptab[aria-selected="true"] {
    background: var(--p-crimson); border-color: var(--p-crimson); color: #fff;
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--p-gold) 65%, transparent);
  }
  .ptab:focus-visible { outline: 2px solid var(--p-gold); outline-offset: 2px; }

  /* ---- the history rail --------------------------------------------
     Built from the page's own headings and the italic date line under each
     one, so the note stays the only copy of what happened and adding a
     section adds a stop. */
  .prail { margin: 20px 0 26px; }
  .prailwrap {
    display: flex; gap: 0; overflow-x: auto; padding: 4px 2px 12px;
    scrollbar-width: none; -ms-overflow-style: none;
  }
  .prailwrap::-webkit-scrollbar { display: none; }
  /* Same rule as the tab strip: fade an edge only where there is more past
     it, so the hint never lies about a rail that already fits. */
  .prail { position: relative; }
  .prail::before, .prail::after {
    content: ''; position: absolute; top: 0; bottom: 22px; width: 34px;
    pointer-events: none; opacity: 0; transition: opacity .15s;
  }
  .prail::before { left: 0; background: linear-gradient(90deg, var(--bg), transparent); }
  .prail::after { right: 0; background: linear-gradient(270deg, var(--bg), transparent); }
  .prail.can-left::before, .prail.can-right::after { opacity: 1; }
  .prailstop {
    flex: 0 0 auto; position: relative; min-width: 104px; max-width: 158px;
    padding: 16px 12px 0 0; border: 0; background: none; cursor: pointer;
    text-align: left; font: inherit; color: var(--muted);
  }
  .prailstop::before {                       /* the rail itself */
    content: ''; position: absolute; left: 0; right: 0; top: 5px;
    height: 1px; background: var(--p-gold); opacity: .55;
  }
  .prailstop:first-child::before { left: 6px; }
  .prailstop:last-child::before { right: calc(100% - 7px); }
  .prailstop::after {                        /* the dot */
    content: ''; position: absolute; left: 1px; top: 0; width: 11px; height: 11px;
    border-radius: 50%; background: var(--panel);
    border: 2px solid var(--p-gold); box-sizing: border-box;
  }
  .prailstop:hover::after, .prailstop:focus-visible::after { background: var(--p-crimson); border-color: var(--p-crimson); }
  .prailstop b { display: block; color: var(--p-crimson-ink); font-size: 14px; line-height: 1.25; }
  .prailstop:hover b { text-decoration: underline; }
  .prailstop span { display: block; font-size: 11.5px; margin-top: 2px; }
  .prailstop:focus-visible { outline: 2px solid var(--p-gold); outline-offset: 2px; border-radius: 6px; }
  .prailnote { color: var(--muted); font-size: 12.5px; margin: 0; }
  /* The section the rail just jumped to, so the eye lands somewhere. */
  .pdoc h2.plit, .pdoc h3.plit { animation: plit 1.6s ease-out 1; }
  @keyframes plit { from { background: color-mix(in srgb, var(--p-gold) 34%, transparent); } to { background: transparent; } }

  /* The sigil, first thing on the welcome page. */
  .pdoc p.psigil { margin: 26px 0 6px; text-align: center; }
  .pdoc p.psigil img {
    display: inline-block; width: min(280px, 62%); max-width: 280px;
    height: auto; border: 0; border-radius: 50%;
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--p-gold) 45%, transparent),
                0 10px 34px rgba(0,0,0,.42);
  }

  .pfoot { margin-top: 44px; padding-top: 14px; border-top: 1px solid var(--p-gold-soft);
           color: var(--muted); font-size: 13px; }
  .pdoc h1 {
    font-size: 1.95em; margin: .55em 0 .45em; padding-bottom: .22em;
    color: var(--p-crimson); letter-spacing: .005em;
    border-bottom: 2px solid var(--p-gold);
  }
  .pdoc h2 {
    font-size: 1.35em; margin: 1.6em 0 .4em; color: var(--p-crimson);
    /* The topbar and the tab strip are both sticky, so a heading scrolled to
       the top of the viewport lands underneath them. */
    scroll-margin-top: calc(var(--topbar-h, 55px) + 72px);
  }
  .pdoc h2::before {
    content: ''; display: inline-block; width: 12px; height: 1px;
    margin: 0 .5em .3em 0; background: var(--p-gold); vertical-align: middle;
  }
  .pdoc h3 {
    color: var(--p-gold); margin: 1.3em 0 .3em;
    scroll-margin-top: calc(var(--topbar-h, 55px) + 72px);
  }
  .pdoc a { color: var(--p-crimson-ink); text-decoration-color: var(--p-gold); }
  .pdoc table { border-collapse: collapse; width: 100%; display: block; overflow-x: auto; margin: 1em 0; }
  .pdoc th, .pdoc td {
    border: 1px solid color-mix(in srgb, var(--p-gold) 34%, transparent);
    padding: 7px 10px; text-align: left; vertical-align: top;
  }
  .pdoc th {
    background: var(--p-gold-wash); color: var(--p-crimson-ink);
    border-bottom-color: var(--p-gold); font-size: .92em;
    text-transform: uppercase; letter-spacing: .05em;
  }
  .pdoc td:first-child { white-space: nowrap; }
  .pdoc figure { margin: 1.4em 0; }
  .pdoc img {
    display: block; max-width: 100%; width: auto; max-height: 72vh; height: auto;
    border-radius: 12px; border: 1px solid var(--rule);
  }
  .pdoc img + em, .pdoc figcaption {
    display: block; margin-top: 7px; color: var(--muted); font-size: 13px;
  }
  .pdoc blockquote { margin: 1em 0; padding: .1em 1em; border-left: 3px solid var(--p-gold); color: var(--muted); }
  .pdoc hr { border: 0; border-top: 1px solid var(--p-gold-soft); margin: 1.8em 0; }
  .pdoc strong { color: color-mix(in srgb, var(--ink) 84%, var(--p-crimson)); }

  /* The world map, on the Nations page only. The image and the nation
     positions are both generated out of campaign/Saeroth.map, so this stays
     correct when the map is rebuilt and needs no copy of its own.

     Pins are decorative and take no pointer events. Every tap lands on the
     wrapper instead and resolves to the nearest capital, which is the only
     hit test that works here: two nations can sit 13 screen pixels apart at
     fit-width, and a 44px target would cover four of them. */
  .pmap { margin: 18px 0 22px; }
  .pmapbox {
    position: relative; overflow: auto; overscroll-behavior: contain;
    border: 1px solid color-mix(in srgb, var(--p-gold) 40%, transparent);
    border-radius: 12px; background: var(--panel);
    max-height: min(64vh, 560px); -webkit-overflow-scrolling: touch;
  }
  .pmapinner { position: relative; width: calc(100% * var(--z, 1)); min-width: 100%; cursor: crosshair; }
  .pmapinner img { display: block; width: 100%; height: auto; }
  .ppin {
    position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px;
    border-radius: 50%; background: var(--panel); border: 2px solid var(--muted);
    pointer-events: none; box-shadow: 0 0 0 1px rgba(0,0,0,.18);
  }
  .ppin.sel {
    width: 16px; height: 16px; margin: -8px 0 0 -8px;
    background: var(--p-crimson); border-color: var(--p-gold-soft);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--p-crimson) 38%, transparent);
  }
  .ppinlbl {
    position: absolute; transform: translate(-50%, -170%); white-space: nowrap;
    padding: 2px 7px; border-radius: 999px; font-size: 12px; font-weight: 600;
    background: var(--p-crimson); color: #fff; pointer-events: none;
    box-shadow: 0 0 0 1px var(--p-gold-soft), 0 1px 4px rgba(0,0,0,.4);
  }
  .pmapbar { display: flex; align-items: center; gap: 7px; margin-top: 9px; }
  .pmapbar .muted { font-size: 12.5px; }
  .pzoom {
    min-width: 34px; height: 30px; padding: 0 9px; border: 1px solid var(--rule);
    border-radius: 8px; background: var(--panel); color: var(--ink);
    font: inherit; font-size: 14px; cursor: pointer;
  }
  .pzoom:hover { border-color: var(--muted); }
  .pcard {
    margin-top: 12px; border-radius: 12px; padding: 12px 14px;
    background: var(--panel);
    border: 1px solid color-mix(in srgb, var(--p-gold) 40%, transparent);
  }
  .pcard h3 { margin: 0 0 6px; font-size: 1.15em; color: var(--p-crimson); }
  .pcard dt {
    font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); margin-top: 8px;
  }
  .pcard dd { margin: 1px 0 0; }
  .pcard dl { margin: 0; }
  /* The nation name in the table doubles as a way onto the map. */
  .pnamebtn {
    border: 0; background: none; padding: 0; margin: 0; font: inherit;
    color: inherit; font-weight: inherit; cursor: pointer;
    text-decoration: underline; text-decoration-style: dotted;
    text-underline-offset: 3px; text-align: left;
  }
  .pnamebtn:hover { color: var(--p-crimson-ink); }

  /* The prose column is about 512px, which is right for prose and wrong for
     a four-column table of it — 125px a column is the same ribbon the phone
     layout exists to avoid. On a wide screen the table and the map break out
     of the column and centre on the page instead. `.pmain` is centred, so
     half of this block equals the middle of the window. The breakpoint is
     701px because that is exactly where the phone card layout below stops —
     leave a gap between the two and a tablet gets the ribbon. */
  @media (min-width: 701px) {
    .pdoc table, .pmap {
      width: min(94vw, 1120px);
      margin-left: calc(50% - min(47vw, 560px));
    }
  }

  /* Three columns of prose inside 390px of phone is a ribbon nobody reads —
     about 110px a column, and one nation fills most of a screen. Narrow
     screens get a card per row instead, with each cell carrying the column
     name it lost. labelCells() below copies those names onto the cells. */
  @media (max-width: 700px) {
    .pdoc table, .pdoc tbody, .pdoc tr, .pdoc td { display: block; width: auto; }
    .pdoc thead { display: none; }
    .pdoc tr {
      border: 1px solid color-mix(in srgb, var(--p-gold) 30%, transparent);
      border-radius: 10px; padding: 11px 13px; margin: 0 0 10px;
      background: color-mix(in srgb, var(--panel) 55%, transparent);
    }
    .pdoc td:first-child { color: var(--p-crimson-ink); }
    .pdoc td { border: 0; padding: 3px 0; white-space: normal; }
    .pdoc td:first-child { font-weight: 700; font-size: 1.06em; padding-bottom: 6px; }
    .pdoc td[data-label]::before {
      content: attr(data-label); display: block;
      font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em;
      color: var(--muted); margin-bottom: 1px;
    }
  }
</style>
</head>
<body>
<header class="topbar">
  <span class="brand"><img class="pmark" src="mark.svg" alt="" width="26" height="26">Saeroth <span class="muted" style="font-weight:400">· for players</span></span>
  <div class="spacer"></div>
  <button id="themeBtn" class="iconbtn" aria-label="Toggle theme">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</header>

<nav class="ptabnav" id="tabnav">
  <button class="pscroll pscroll-l" type="button" aria-label="Scroll tabs left"><span>&lsaquo;</span></button>
  <div class="ptabs" id="tabs" role="tablist"></div>
  <button class="pscroll pscroll-r" type="button" aria-label="Scroll tabs right"><span>&rsaquo;</span></button>
</nav>

<main class="pmain">
  <article class="pdoc" id="doc">Loading…</article>
  <p class="pfoot">A traveller's picture of the world — what people say, not
    necessarily what is so.</p>
</main>

<script src="../marked.min.js"></script>
<script>
(function () {
  const theme = localStorage.getItem('theme');
  if (theme) document.documentElement.dataset.theme = theme;
  document.getElementById('themeBtn').onclick = () => {
    const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = next;
    localStorage.setItem('theme', next);
  };

  /* This page registers no service worker of its own, and is controlled by
     the main site's one anyway, because that worker's scope is the whole
     site. That worker used to cache these documents, so ask its registration
     to check for an update on every load: a phone that only ever opens
     /players/ would otherwise keep the old worker, and keep being served the
     old copy, with nothing to make it look. Reload once when a new worker
     takes over, and only when one was already in charge, so a first visit
     does not flash. */
  if (navigator.serviceWorker) {
    navigator.serviceWorker.getRegistration()
      .then((reg) => reg && reg.update())
      .catch(() => {});
    const had = !!navigator.serviceWorker.controller;
    let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!had || reloading) return;
      reloading = true;
      location.reload();
    });
  }

  /* The tab strip is sticky beneath the topbar, and the topbar is not a
     fixed height: installed to an iOS home screen it grows by the safe-area
     inset. styles.css ships --topbar-h as a 55px starting guess and app.js
     remeasures it, but app.js does not run here, so this page has to do it
     itself or the strip sits over the bar or under a gap. */
  function syncTopbarHeight() {
    const bar = document.querySelector('.topbar');
    if (!bar) return;
    document.documentElement.style.setProperty(
      '--topbar-h', Math.round(bar.getBoundingClientRect().height) + 'px');
  }
  syncTopbarHeight();
  addEventListener('resize', syncTopbarHeight);
  if (window.ResizeObserver) {
    new ResizeObserver(syncTopbarHeight).observe(document.querySelector('.topbar'));
  }

  const tabs = document.getElementById('tabs');
  const tabnav = document.getElementById('tabnav');

  function updateTabHints() {
    const max = tabs.scrollWidth - tabs.clientWidth;
    tabnav.classList.toggle('can-left', tabs.scrollLeft > 2);
    tabnav.classList.toggle('can-right', tabs.scrollLeft < max - 2);
  }
  tabs.addEventListener('scroll', updateTabHints, { passive: true });
  addEventListener('resize', updateTabHints);
  for (const [sel, dir] of [['.pscroll-l', -1], ['.pscroll-r', 1]]) {
    tabnav.querySelector(sel).onclick = () =>
      tabs.scrollBy({ left: dir * tabs.clientWidth * 0.62, behavior: 'smooth' });
  }
  const doc = document.getElementById('doc');
  let pages = [];
  let current = -1;

  // Wikilinks are stripped rather than resolved: these documents stand alone,
  // and a link into the vault is exactly what this page is for not having.
  const clean = (md) => md.replace(/\[\[([^\]|#]+)(\|([^\]]+))?\]\]/g, (_, t, __, alt) => alt || t);

  /* Stamp each body cell with its column heading so the narrow layout can
     print it. A header cell that is blank — the nation-name column — stamps
     nothing, and that cell just reads as the card's title. */
  function labelCells(root) {
    for (const t of root.querySelectorAll('table')) {
      const heads = [...t.querySelectorAll('thead th')].map((h) => h.textContent.trim());
      if (!heads.length) continue;
      for (const r of t.querySelectorAll('tbody tr')) {
        [...r.cells].forEach((c, i) => { if (heads[i]) c.dataset.label = heads[i]; });
      }
    }
  }

  /* ---- The world map, on the Nations page only -------------------------

     Both halves of this are generated out of campaign/Saeroth.map by
     tools/map_backdrop.js, so a rebuilt map moves the pins with no edit
     here. The nation data is read out of the page's own rendered tables
     rather than duplicated, which is the same rule the vault's other views
     follow: adding a row to the markdown adds a pin.

     Missing pieces are not an error. If the positions file or the image is
     absent the page is exactly what it was before, a table of nations. */

  const MAP_PAGE = 'The Nations.md';
  let mapData = null;      // the parsed positions file, fetched once
  let mapDataTried = false;

  async function positions() {
    if (mapDataTried) return mapData;
    mapDataTried = true;
    try {
      const r = await fetch('../nation-positions.json');
      if (r.ok) mapData = await r.json();
    } catch (e) { /* no map, no panel */ }
    return mapData;
  }

  async function mountMap(root) {
    const data = await positions();
    if (!data || !data.nations || !data.width) return null;

    /* Index the rendered rows by nation name. The first cell is the name and
       the rest are whatever columns the markdown happens to carry, so adding
       a column to the table adds a line to the card. */
    /* A page can name the same nation in more than one table — the profile
       rows and the naming rows both do — and the card wants all of it. Keep
       every row in document order and let the card merge them, so the profile
       comes first and the naming follows it. Storing one row instead of a
       list is how the card briefly turned into two lines about what the names
       sound like: the last table on the page had won. */
    const rows = new Map();
    for (const tr of root.querySelectorAll('tbody tr')) {
      const cells = [...tr.cells];
      if (cells.length < 2) continue;
      const name = cells[0].textContent.trim();
      if (!data.nations[name]) continue;
      if (!rows.has(name)) rows.set(name, []);
      rows.get(name).push(tr);
    }
    if (!rows.size) return null;

    const wrap = document.createElement('div');
    wrap.className = 'pmap';
    wrap.innerHTML =
      '<div class="pmapbox"><div class="pmapinner">' +
      '<img alt="Political map of Saeroth" src="../' + data.image + '">' +
      '</div></div>' +
      '<div class="pmapbar">' +
      '<button class="pzoom" type="button" data-z="out" aria-label="Zoom out">&minus;</button>' +
      '<button class="pzoom" type="button" data-z="in" aria-label="Zoom in">+</button>' +
      '<button class="pzoom" type="button" data-z="fit">Fit</button>' +
      '<span class="muted">Tap the map for the nearest country.</span>' +
      '</div><div class="pcard" hidden></div>';

    const box = wrap.querySelector('.pmapbox');
    const inner = wrap.querySelector('.pmapinner');
    const card = wrap.querySelector('.pcard');
    const pins = new Map();

    for (const [name, xy] of Object.entries(data.nations)) {
      if (!rows.has(name)) continue;
      const pin = document.createElement('span');
      pin.className = 'ppin';
      pin.style.left = (xy[0] / data.width * 100) + '%';
      pin.style.top = (xy[1] / data.height * 100) + '%';
      inner.appendChild(pin);
      pins.set(name, pin);
    }

    let label = null;
    function select(name, scroll) {
      for (const [n, pin] of pins) pin.classList.toggle('sel', n === name);
      if (label) label.remove();
      const pin = pins.get(name);
      if (!pin) return false;
      label = document.createElement('span');
      label.className = 'ppinlbl';
      label.textContent = name;
      label.style.left = pin.style.left;
      label.style.top = pin.style.top;
      inner.appendChild(label);

      const dl = document.createElement('dl');
      const seen = new Set();
      for (const tr of rows.get(name)) {
        for (const cell of [...tr.cells].slice(1)) {
          const label = cell.dataset.label || '';
          if (seen.has(label)) continue;   // two tables sharing a column name
          seen.add(label);
          const dt = document.createElement('dt');
          dt.textContent = label;
          const dd = document.createElement('dd');
          dd.innerHTML = cell.innerHTML;
          dl.append(dt, dd);
        }
      }
      card.innerHTML = '';
      const h = document.createElement('h3');
      h.textContent = name;
      card.append(h, dl);
      card.hidden = false;
      if (scroll) {
        box.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        pin.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      }
      return true;
    }

    /* Nearest capital wins. Distance is measured in the image's own pixels
       rather than in fractions, so a wide map does not bias the choice
       toward vertical neighbours. */
    inner.addEventListener('click', (e) => {
      const r = inner.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width * data.width;
      const y = (e.clientY - r.top) / r.height * data.height;
      let best = null, bestD = Infinity;
      for (const name of pins.keys()) {
        const [px, py] = data.nations[name];
        const d = (px - x) * (px - x) + (py - y) * (py - y);
        if (d < bestD) { bestD = d; best = name; }
      }
      if (best) select(best, false);
    });

    /* Zoom keeps whatever was in the middle of the box in the middle of the
       box, which is the difference between a usable map and one that throws
       you into the ocean every time you press +. */
    let z = 1;
    function setZoom(next) {
      next = Math.min(4, Math.max(1, next));
      const cx = (box.scrollLeft + box.clientWidth / 2) / inner.offsetWidth;
      const cy = (box.scrollTop + box.clientHeight / 2) / inner.offsetHeight;
      z = next;
      inner.style.setProperty('--z', z);
      requestAnimationFrame(() => {
        box.scrollLeft = cx * inner.offsetWidth - box.clientWidth / 2;
        box.scrollTop = cy * inner.offsetHeight - box.clientHeight / 2;
      });
    }
    for (const b of wrap.querySelectorAll('.pzoom')) {
      b.onclick = () => {
        if (b.dataset.z === 'fit') { z = 1; inner.style.setProperty('--z', 1); box.scrollTo(0, 0); }
        else setZoom(z * (b.dataset.z === 'in' ? 1.6 : 1 / 1.6));
      };
    }

    // The first table to name a nation gets the button; the rest stay plain.
    for (const [name, trs] of rows) {
      const cell = trs[0].cells[0];
      const strong = cell.querySelector('strong') || cell;
      const btn = document.createElement('button');
      btn.className = 'pnamebtn';
      btn.type = 'button';
      btn.innerHTML = strong.innerHTML;
      btn.onclick = () => select(name, true);
      strong.innerHTML = '';
      strong.appendChild(btn);
    }

    const first = root.querySelector('h2') || root.querySelector('table');
    if (first) first.parentNode.insertBefore(wrap, first);
    else root.appendChild(wrap);

    return select;
  }

  /* Art embedded in a document sits beside it in players/ and is copied
     beside it into content/, so `![](towers.jpg)` is right in the file and
     needs pointing at content/ once rendered. */
  function resolveImages(root) {
    for (const img of root.querySelectorAll('img')) {
      const src = img.getAttribute('src') || '';
      if (!src || /^(?:[a-z]+:|\/\/|\/)/i.test(src)) continue;
      img.src = 'content/' + src.split('/').map(encodeURIComponent).join('/');
      img.loading = 'lazy';
    }
  }

  /* A document whose first block is nothing but an image is a sigil rather
     than an illustration, and gets centred and rounded instead of running
     the width of the column. */
  function markSigil(root) {
    const first = root.firstElementChild;
    if (first && first.tagName === 'P' && first.children.length === 1
        && first.firstElementChild.tagName === 'IMG'
        && !first.textContent.trim()) {
      first.classList.add('psigil');
    }
  }

  /* The history page gets a rail across the top: one stop per section, in the
     order the page already tells them, labelled with the heading and the
     italic date line beneath it. Both come out of the note, so a section
     added to the markdown is a stop added here with no code change. */
  const RAIL_PAGE = 'History.md';

  /* Scroll a heading into view and flash it. The flash is the whole point:
     a page that simply jumps leaves the reader working out what moved. */
  function jumpTo(root, h) {
    h.scrollIntoView({ behavior: 'smooth', block: 'start' });
    for (const lit of root.querySelectorAll('.plit')) lit.classList.remove('plit');
    // restart the highlight even when the same target is asked for twice
    void h.offsetWidth;
    h.classList.add('plit');
  }

  /* A link may name a section rather than a page: #History/The%20Delta%20War.
     Headings are matched by their own text, so the target of a link is what
     the heading says and nothing has to be kept in step by hand. */
  function focusSection(root, name) {
    const want = name.trim().toLowerCase();
    for (const h of root.querySelectorAll('h2, h3')) {
      if (h.textContent.trim().toLowerCase() === want) { jumpTo(root, h); return true; }
    }
    return false;
  }

  function mountRail(root) {
    const stops = [];
    for (const h of root.querySelectorAll('h2')) {
      const first = h.nextElementSibling;
      const date = first && first.tagName === 'P' && first.children.length === 1
        && first.firstElementChild.tagName === 'EM' && !first.textContent.replace(first.textContent.trim(), '').length
        ? first.textContent.trim() : '';
      // The rail wants the year, not the whole line. A date line is written
      // `2316 AR — signed sixty years ago`, so the hinge is where it ends;
      // a line with no hinge is short enough already.
      stops.push({ h, name: h.textContent.trim(), date: date.split(' — ')[0] });
    }
    if (stops.length < 2) return;

    const rail = document.createElement('nav');
    rail.className = 'prail';
    rail.setAttribute('aria-label', 'Jump to an event');
    const wrap = document.createElement('div');
    wrap.className = 'prailwrap';
    for (const s of stops) {
      const b = document.createElement('button');
      b.className = 'prailstop';
      b.type = 'button';
      b.innerHTML = '<b></b><span></span>';
      b.querySelector('b').textContent = s.name;
      b.querySelector('span').textContent = s.date;
      b.onclick = () => jumpTo(root, s.h);
      wrap.appendChild(b);
    }
    const note = document.createElement('p');
    note.className = 'prailnote';
    note.textContent = 'Newest first. Tap an event to read it.';
    rail.append(wrap, note);

    const hints = () => {
      const max = wrap.scrollWidth - wrap.clientWidth;
      rail.classList.toggle('can-left', wrap.scrollLeft > 2);
      rail.classList.toggle('can-right', wrap.scrollLeft < max - 2);
    };
    wrap.addEventListener('scroll', hints, { passive: true });
    addEventListener('resize', hints);
    requestAnimationFrame(hints);

    const h1 = root.querySelector('h1');
    (h1 ? h1.nextElementSibling || h1 : root.firstElementChild)
      .insertAdjacentElement(h1 ? 'afterend' : 'beforebegin', rail);
  }

  async function show(i, focus) {
    current = i;
    [...tabs.children].forEach((b, n) => {
      const on = n === i;
      b.setAttribute('aria-selected', on ? 'true' : 'false');
      if (on) b.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    });
    updateTabHints();
    location.hash = '#' + encodeURIComponent(pages[i].file.replace(/\.md$/, ''))
      + (focus ? '/' + encodeURIComponent(focus) : '');
    doc.innerHTML = '<p class="muted">Loading…</p>';
    try {
      const res = await fetch('content/' + encodeURIComponent(pages[i].file));
      if (!res.ok) throw new Error(res.status);
      doc.innerHTML = marked.parse(clean(await res.text()));
      labelCells(doc);
      resolveImages(doc);
      markSigil(doc);
      if (pages[i].file === RAIL_PAGE) mountRail(doc);
      scrollTo(0, 0);
      let placed = false;
      if (pages[i].file === MAP_PAGE) {
        const select = await mountMap(doc);
        // A link may name a nation: #The%20Nations/Dalstan opens the tab with
        // that country already picked on the map, which is the only reason
        // somebody following a link about Dalstan wanted this page.
        if (select && focus) placed = select(focus, true);
      }
      // Anything else a link names is a section heading, on any page.
      if (focus && !placed) focusSection(doc, focus);
    } catch (e) {
      doc.innerHTML = '<p class="muted">Could not load that page.</p>';
    }
  }

  fetch('pages.json').then((r) => r.json()).then((list) => {
    pages = list;
    list.forEach((p, i) => {
      const b = document.createElement('button');
      b.className = 'ptab'; b.type = 'button'; b.role = 'tab';
      b.textContent = p.title;
      b.onclick = () => show(i);
      tabs.appendChild(b);
    });
    updateTabHints();
    /* The hash is a page name, optionally followed by /<focus> — a nation on
       the map page, or a section heading anywhere. Page names, nation names
       and headings all contain no slash, so the first one separates them. */
    const wanted = () => {
      const raw = location.hash.replace(/^#/, '');
      const cut = raw.indexOf('/');
      const want = decodeURIComponent(cut < 0 ? raw : raw.slice(0, cut));
      const focus = cut < 0 ? '' : decodeURIComponent(raw.slice(cut + 1));
      return { at: list.findIndex((p) => p.file.replace(/\.md$/, '') === want), focus };
    };
    /* Every tab click writes location.hash, so Back and Forward move it.
       Without this the address bar changes and the document does not, which
       is worse than having no history at all — the page ends up claiming to
       show something it isn't. */
    addEventListener('hashchange', () => {
      const { at, focus } = wanted();
      // A focus is a fresh instruction even when the page is already open.
      if (at >= 0 && (at !== current || focus)) show(at, focus);
    });
    const { at, focus } = wanted();
    show(at >= 0 ? at : 0, focus);
  }).catch(() => { doc.innerHTML = '<p class="muted">Nothing here yet.</p>'; });
})();
</script>
</body>
</html>
