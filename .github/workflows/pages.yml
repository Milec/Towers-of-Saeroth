name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'campaign/**'
      - 'vault/**'
      - 'site/**'
      - 'tools/build_site.py'
      - 'tools/make_icons.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      include_vault:
        description: 'Include the full rules vault (~108 MB, slower deploy)'
        type: boolean
        default: true

# Pages needs these to mint the deployment token.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate PWA icons
        run: python3 tools/make_icons.py

      - name: Install the sealer
        run: pip install --quiet pycryptodome

      # The deployed site is the PLAYERS' site. GitHub Pages is public below
      # Enterprise, so anything built here is readable by anyone with the URL —
      # which is why the GM half is sealed rather than merely unlinked.
      #
      # GM_PASSPHRASE is a repository secret. If it is unset the build still
      # succeeds and simply ships no GM material at all; it never falls back
      # to publishing the plaintext.
      - name: Build site
        env:
          GM_PASSPHRASE: ${{ secrets.GM_PASSPHRASE }}
        run: |
          if [ "${{ github.event.inputs.include_vault }}" = "false" ]; then
            python3 tools/build_site.py --no-vault
          else
            python3 tools/build_site.py
          fi

      # A build that published a GM note in the clear is the one failure that
      # matters, so check the artifact rather than trusting the code.
      - name: Refuse to deploy plaintext GM material
        run: |
          if grep -rqiE "sorcerer.king|nameless empire|casa berruel" _site/content _site/index-campaign.json; then
            echo "::error::GM material found in the player build - refusing to deploy"
            grep -rliE "sorcerer.king|nameless empire|casa berruel" _site/content _site/index-campaign.json
            exit 1
          fi
          echo "player build is clean"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
