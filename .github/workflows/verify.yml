name: Verify repository and interface
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - name: Install locked test dependencies
        working-directory: tools/atlas-tests
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: tools/atlas-tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Check campaign consistency
        run: |
          python tools/check_subprovinces.py
          python tools/test_campaign_pois.py
          node tools/atlas-tests/poi-github.cjs
          node tools/atlas-tests/poi-auto-merge.cjs
          node tools/atlas-tests/publisher.cjs
          node tools/atlas-tests/editor-auto-merge.cjs
          node tools/atlas-tests/battlemap-engine.cjs
          node tools/atlas-tests/battlemap-foundry.cjs
          python tools/lint_notes.py
          python tools/sync_relations.py --check
          python tools/sync_faith.py --check
      - name: Build preview
        run: python tools/build_site.py --no-vault
      - name: Check caravan scene assets and geometry
        run: |
          node foundry-module/scripts/test-milo.mjs
          node foundry-module/scripts/test-shamblers.mjs
          node foundry-module/scripts/test-content-sync.mjs
          node foundry-module/scripts/test-caravan-scene.mjs
          node foundry-module/scripts/test-tavern-scene.mjs
          node foundry-module/scripts/test-session-three-scenes.mjs
          node foundry-module/scripts/test-caravan-background-repair.mjs
          node --test foundry-module/scripts/test-foundry-mcp.mjs
          node --test foundry-module/scripts/test-session-inbox.mjs
          node --test foundry-module/scripts/test-document-ids.mjs
          node foundry-module/scripts/test-expedition-scenes.mjs
      - name: Test atlas behavior
        working-directory: tools/atlas-tests
        run: pnpm run test:features
      - name: Test website in Chromium
        run: |
          python -m http.server 8899 --directory _site > /tmp/saeroth-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node tools/atlas-tests/browser.cjs
          node tools/atlas-tests/audits.cjs
          node tools/atlas-tests/handouts.cjs
          node tools/atlas-tests/subprovinces.cjs
          node tools/atlas-tests/journey-inputs.cjs
          node tools/atlas-tests/hexcrawl.cjs
          node tools/atlas-tests/usability.cjs
          node tools/atlas-tests/custom-pois.cjs
          node tools/atlas-tests/poi-sync.cjs
          node tools/atlas-tests/workspace.cjs
          node tools/atlas-tests/workbench.cjs
          node tools/atlas-tests/search.cjs
          node tools/atlas-tests/reader.cjs
          node tools/atlas-tests/editor.cjs
          node tools/atlas-tests/editor-publisher.cjs
          node tools/atlas-tests/editor-images.cjs
          node tools/atlas-tests/panels.cjs
          node tools/atlas-tests/battlemaps.cjs
          node tools/atlas-tests/session-package.cjs
